# Faz 0: ayrı bir test/geçiş domaini (ylina.life) üzerinde paralel test.
# Her şey istenildiği gibi çalıştığı doğrulanana kadar gulumsalim.com'un
# DNS'i buraya çevrilmeyecek, eski PHP site kesintisiz sunmaya devam ediyor
# (bkz. mimari planı §7).
server {
    listen 80;
    server_name ylina.life www.ylina.life;

    client_max_body_size 20m;

    # Ürün görselleri Node'a hiç uğramadan doğrudan diskten sunulur.
    location /uploads/ {
        alias /opt/gulumsalim/uploads/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
