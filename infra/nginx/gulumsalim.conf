# Faz 0: ayrı bir test/geçiş domaini (ylina.life) üzerinde paralel test.
# Her şey istenildiği gibi çalıştığı doğrulanana kadar gulumsalim.com'un
# DNS'i buraya çevrilmeyecek, eski PHP site kesintisiz sunmaya devam ediyor
# (bkz. mimari planı §7).
#
# TODO (CLAUDE-001, production blocker): TLS. certbot ile Let's Encrypt,
# `listen 443 ssl http2;`, :80 -> :443 kalıcı redirect ve HSTS (aşağıda).
# TLS hazır OLMADAN HSTS/CSP eklenmemeli.

# Bilinmeyen Host header'larını reddeden default sunucu — bu bloğun catch-all
# olmasını ve Host header injection'ı engeller (CLAUDE-006).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ylina.life www.ylina.life;

    client_max_body_size 20m;

    # Güvenlik header'ları (CLAUDE-007). `always` ile hata yanıtlarında da
    # gönderilir. HSTS ve tam CSP TLS kurulunca (CLAUDE-001) eklenecek.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Ürün görselleri Node'a hiç uğramadan doğrudan diskten sunulur.
    location /uploads/ {
        alias /opt/gulumsalim/uploads/;
        access_log off;
        expires 30d;

        # Yüklenen içerik aynı-origin script çalıştıramasın: kötü niyetli
        # HTML/SVG upload'ı stored XSS'e dönüşmesin (CLAUDE-008). CSP+sandbox
        # doğrudan açılan dosyada script'i bloklar; <img> ile gömülen meşru
        # görselleri etkilemez. nginx child context add_header tanımlayınca
        # server seviyesindekiler düştüğü için burada tekrarlanır.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Yavaş upstream / asılı bağlantılara karşı makul timeout'lar.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
