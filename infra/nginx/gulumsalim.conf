# gulumsalim.com artık canlı/kanonik domain. ylina.life, geçiş/test dönemi
# domainiydi (bkz. mimari planı §7); artık gulumsalim.com'a kalıcı (301)
# yönlendiriliyor, SSL sertifikası her iki domaini de (ve www varyantlarını)
# kapsıyor. Bu dosya sunucudaki gerçek çalışan config ile senkron tutulur -
# TLS/HSTS/Cloudflare gerçek IP ayarları certbot ile kuruldu (CLAUDE-001),
# elle düzenlenmiş kısımlar burada da yansıtılıyor.

server {
    server_name gulumsalim.com;

    client_max_body_size 20m;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    server_tokens off;

    # Güvenlik header'ları (additive, CLAUDE-007). Cloudflare üzerinden tarayıcıya geçer.
    # X-Frame-Options SAMEORIGIN (DENY değil): satıcı panelindeki "Mağaza
    # Düzeni" canlı önizlemesi, mağazanın herkese açık sayfasını kendi
    # domaininde bir iframe içinde gösteriyor - DENY bunu da engelliyordu.
    # SAMEORIGIN dış sitelerden clickjacking korumasını aynen korur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    # Ürün görselleri Node'a hiç uğramadan doğrudan diskten sunulur.
    location /uploads/ {
        alias /opt/gulumsalim/uploads/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ylina.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ylina.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www.gulumsalim.com ve eski ylina.life/www.ylina.life -> kanonik gulumsalim.com.
server {
    server_name www.gulumsalim.com www.ylina.life ylina.life;
    return 301 https://gulumsalim.com$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ylina.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ylina.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gulumsalim.com) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    if ($host = www.ylina.life) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    if ($host = ylina.life) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    if ($host = gulumsalim.com) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gulumsalim.com www.gulumsalim.com ylina.life www.ylina.life;
    return 404; # managed by Certbot
}
