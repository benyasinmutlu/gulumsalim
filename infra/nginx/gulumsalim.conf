# gulumsalim.com artık canlı/kanonik domain. ylina.life, geçiş/test dönemi
# domainiydi (bkz. mimari planı §7); artık gulumsalim.com'a kalıcı (301)
# yönlendiriliyor, SSL sertifikası her iki domaini de (ve www varyantlarını)
# kapsıyor. Bu dosya sunucudaki gerçek çalışan config ile senkron tutulur -
# TLS/HSTS/Cloudflare gerçek IP ayarları certbot ile kuruldu (CLAUDE-001),
# elle düzenlenmiş kısımlar burada da yansıtılıyor.

# Cloudflare Real-IP modülü istemci adresini düzelttikten sonra origin abuse
# sınırları gerçek ziyaretçi IP'sine göre uygulanır.
limit_req_zone $binary_remote_addr zone=gs_api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gs_web_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=gs_connections_per_ip:10m;

server {
    server_name gulumsalim.com;

    # API ve arayüz ürün videosu için 50 MB sınırı bildiriyor. Proxy daha
    # düşük kalırsa 20-50 MB arası geçerli dosyalar Node'a ulaşmadan 413 alır.
    client_max_body_size 50m;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    server_tokens off;

    # Güvenlik header'ları (additive, CLAUDE-007). Cloudflare üzerinden tarayıcıya geçer.
    # X-Frame-Options SAMEORIGIN (DENY değil): satıcı panelindeki "Mağaza
    # Düzeni" canlı önizlemesi, mağazanın herkese açık sayfasını kendi
    # domaininde bir iframe içinde gösteriyor - DENY bunu da engelliyordu.
    # SAMEORIGIN dış sitelerden clickjacking korumasını aynen korur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    limit_req_status 429;
    limit_conn_status 429;

    # Ürün görselleri Node'a hiç uğramadan doğrudan diskten sunulur.
    location /uploads/ {
        alias /opt/gulumsalim/uploads/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        limit_req zone=gs_api_per_ip burst=40 nodelay;
        limit_conn gs_connections_per_ip 30;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_req zone=gs_web_per_ip burst=60 nodelay;
        limit_conn gs_connections_per_ip 40;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ylina.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ylina.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www.gulumsalim.com ve eski ylina.life/www.ylina.life -> kanonik gulumsalim.com.
server {
    server_name www.gulumsalim.com www.ylina.life ylina.life;
    return 301 https://gulumsalim.com$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ylina.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ylina.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gulumsalim.com) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    if ($host = www.ylina.life) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    if ($host = ylina.life) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    if ($host = gulumsalim.com) {
        return 301 https://gulumsalim.com$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gulumsalim.com www.gulumsalim.com ylina.life www.ylina.life;
    return 404; # managed by Certbot
}
